<!doctype html><meta charset="utf-8"><title>Whisper beam timestamp validation</title>
<button id="run">Run validation</button><pre id="result"></pre>
<script type="module">
import * as lib from '../../packages/transformers/dist/transformers.web.js';
import { run } from './harness.mjs';
window.runTimestamps = async (options = {}) => {
 const adapter = await navigator.gpu?.requestAdapter();
 const adapterInfo = adapter ? { ...Object.fromEntries(['vendor','architecture','device','description'].map(k => [k, adapter.info[k]])), shaderF16: adapter.features.has('shader-f16'), isFallbackAdapter: adapter.info.isFallbackAdapter } : null;
 if (options.device === 'webgpu' && (!adapter || adapterInfo.isFallbackAdapter)) throw Error('Hardware WebGPU adapter required');
 if (options.device === 'webgpu' && options.dtype === 'fp16' && !adapterInfo.shaderF16) throw Error('shader-f16 required');
 return { adapterInfo, userAgent: navigator.userAgent, ...await run(lib, options) };
};
document.querySelector('#run').onclick = async () => { try { document.querySelector('#result').textContent = JSON.stringify(await window.runTimestamps(JSON.parse(new URLSearchParams(location.search).get('options') ?? '{"device":"webgpu","dtype":"fp32"}')), null, 2); } catch(e) { document.querySelector('#result').textContent = e.stack; } };
</script>
